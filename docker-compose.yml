# Local development only. Production uses managed Postgres (RDS/Neon) — see
# DESIGN.md §10.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evidwell
      POSTGRES_PASSWORD: evidwell
      POSTGRES_DB: evidwell
    ports:
      # Host port is 5433, not 5432: a native Postgres (Homebrew postgresql@15)
      # binds 127.0.0.1:5432 specifically, which beats Docker's wildcard bind
      # and silently shadows this container for `localhost` connections.
      - "5433:5432"
    volumes:
      - evidwell_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidwell"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Inside Docker the hostname is the service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://evidwell:evidwell@db:5432/evidwell
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist reviewer-uploaded media across container restarts.
      - evidwell_media:/app/var/media

volumes:
  evidwell_pgdata:
  evidwell_media:
