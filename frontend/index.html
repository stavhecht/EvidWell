<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You.th — simplifying your way to stay young</title>
    <meta
      name="description"
      content="Health, skincare and training claims read against the studies behind them. Every article is reviewed by a person before it is published."
    />
    <link rel="icon" href="/media/you.th-logo.png" />

    <!-- Instrument Serif carries the interface: every heading, label, control
         and paragraph is set in it. Archivo is kept for exactly two jobs the
         serif must not do — article titles (the one place a headline has to
         hold at 11px on a photograph) and the nav buttons in the site bar,
         the drawer and the tab bar, which are 10px tracked-out caps.

         Instrument Serif ships one weight, 400, plus its italic; Archivo is
         requested at the weights those two exceptions actually use.

         Preconnect because the fonts are on the critical path for first paint,
         and `display=swap` so text is never invisible while they load. The
         design system's own stylesheet carries an @import for Archivo; it is
         stripped from our vendored copy so this link is the single fetch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme applied before first paint.

      This has to be a blocking inline script rather than a React effect: an
      effect runs after the first paint, so a reader on the dark theme gets a
      full-screen flash of the light ground on every load. Kept in sync with
      `src/lib/theme.ts`, which owns the same storage key.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("youth.theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
